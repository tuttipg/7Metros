name: AI Runtime Bootstrap

on:
  push:
    branches:
      - automation/ai-runtime-bootstrap

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact Ultralytics wheel
        run: |
          set -euo pipefail
          mkdir -p runtime
          python -m pip download --no-deps --dest runtime 'ultralytics==8.4.163'

      - name: Download official YOLO11n weights
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt' \
            --output runtime/yolo11n.pt
          echo '0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  runtime/yolo11n.pt' | sha256sum --check --strict

      - name: Record reproducibility manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('runtime')
          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  files[path.name] = {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          manifest = {
              'python': '3.11',
              'ultralytics': '8.4.163',
              'model': 'yolo11n.pt',
              'expected_model_sha256': '0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1',
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sevenmetros-ai-runtime-8.4.163
          path: runtime/
          if-no-files-found: error
          retention-days: 3
