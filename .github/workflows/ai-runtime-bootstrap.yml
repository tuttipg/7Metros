name: AI Runtime Bootstrap

on:
  push:
    branches:
      - automation/ai-runtime-bootstrap

permissions:
  contents: read

jobs:
  package-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download exact Python runtime dependencies
        run: |
          set -euo pipefail
          mkdir -p runtime
          python -m pip download --no-deps --dest runtime 'ultralytics==8.4.163'

      - name: Download reference and specialized ball weights
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt' \
            --output runtime/yolo11n.pt
          echo '0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  runtime/yolo11n.pt' | sha256sum --check --strict
          curl --fail --location --retry 3 \
            'https://huggingface.co/martinjolif/yolo-football-ball-detection/resolve/main/yolo-football-ball-detection.pt' \
            --output runtime/yolo-football-ball-detection.pt
          curl --fail --location --retry 3 \
            'https://huggingface.co/acatorcini/yolov9-soccer-ball/resolve/main/v9b_best.pt' \
            --output runtime/v9b_best.pt
          test -s runtime/yolo-football-ball-detection.pt
          test -s runtime/v9b_best.pt
          sha256sum runtime/yolo-football-ball-detection.pt runtime/v9b_best.pt

      - name: Record reproducibility manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('runtime')
          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  files[path.name] = {
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
          manifest = {
              'source_commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'python': '3.11',
              'ultralytics': '8.4.163',
              'specialized_model_sources': [
                'martinjolif/yolo-football-ball-detection',
                'acatorcini/yolov9-soccer-ball'
              ],
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sevenmetros-specialized-ball-runtime-v2
          path: runtime/
          if-no-files-found: error
          retention-days: 3
