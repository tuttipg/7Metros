name: FEMEBAL player diagnostic — profile coverage

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-player-profile-coverage-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
      TOURNAMENT_ID: '775'
    steps:
      - name: Compare profile and formation fields without logging values
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get(){
            local path="$1" out="$2"
            curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" --output "$out" --write-out '%{http_code}' "${API_BASE}${path}"
          }

          roster="$tmp/roster.json"
          code="$(get "/athletes/athletesByTeam/${TEAM_ID}?tournamentId=${TOURNAMENT_ID}" "$roster")"
          [[ "$code" == 200 ]] || exit 1
          [[ "$(jq 'length' "$roster")" == 16 ]] || exit 1
          ids_csv="$(jq -r '[.[].id|tostring]|join(",")' "$roster")"

          formation="$tmp/formation.json"
          code="$(get "/athletes/formation/positionAndNumber?athleteIds=${ids_csv}" "$formation")"
          [[ "$code" == 200 ]] || exit 1
          jq -e 'type=="object" and length==16' "$formation" >/dev/null

          profile_200=0
          position_equal_all=0
          shirt_equal_all=0
          position_both_nonnull_equal=0
          shirt_both_nonnull_equal=0
          position_mismatch=0
          shirt_mismatch=0
          position_null_pattern_mismatch=0
          shirt_null_pattern_mismatch=0

          while read -r id; do
            p="$tmp/profile-${id}.json"
            code="$(get "/users/athlete-profile/${id}" "$p")"
            [[ "$code" == 200 ]] || continue
            profile_200=$((profile_200+1))

            pp="$(jq -c '.position // null' "$p")"
            fp="$(jq -c --arg id "$id" '.[$id].position // null' "$formation")"
            ps="$(jq -c '.shirtNumber // null' "$p")"
            fs="$(jq -c --arg id "$id" '.[$id].shirtNumber // null' "$formation")"

            if [[ "$pp" == "$fp" ]]; then
              position_equal_all=$((position_equal_all+1))
              [[ "$pp" != null ]] && position_both_nonnull_equal=$((position_both_nonnull_equal+1)) || true
            else
              position_mismatch=$((position_mismatch+1))
              if [[ "$pp" == null || "$fp" == null ]]; then position_null_pattern_mismatch=$((position_null_pattern_mismatch+1)); fi
            fi

            if [[ "$ps" == "$fs" ]]; then
              shirt_equal_all=$((shirt_equal_all+1))
              [[ "$ps" != null ]] && shirt_both_nonnull_equal=$((shirt_both_nonnull_equal+1)) || true
            else
              shirt_mismatch=$((shirt_mismatch+1))
              if [[ "$ps" == null || "$fs" == null ]]; then shirt_null_pattern_mismatch=$((shirt_null_pattern_mismatch+1)); fi
            fi
          done < <(jq -r '.[].id|tostring' "$roster")

          echo "profiles_compared=${profile_200}"
          echo "position_equal_including_null=${position_equal_all}"
          echo "position_both_nonnull_equal=${position_both_nonnull_equal}"
          echo "position_mismatch=${position_mismatch}"
          echo "position_null_pattern_mismatch=${position_null_pattern_mismatch}"
          echo "shirtNumber_equal_including_null=${shirt_equal_all}"
          echo "shirtNumber_both_nonnull_equal=${shirt_both_nonnull_equal}"
          echo "shirtNumber_mismatch=${shirt_mismatch}"
          echo "shirtNumber_null_pattern_mismatch=${shirt_null_pattern_mismatch}"

          [[ "$profile_200" == 16 ]]
          echo 'No player names, dates, position values, shirt numbers, profile values, or federative values were logged.'
          echo 'Guest legítimo 1.1.3; GET-only; sin Supabase ni producción.'
