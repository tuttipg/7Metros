name: Bootstrap sports-ball model

on:
  push:
    branches:
      - tmp/ball-model-bootstrap-20261002

jobs:
  inspect-public-handball-data:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Universe pages
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://universe.roboflow.com/ahmeds-workspace-fbvwb/handball-ball-player-detection/dataset/2' \
            -o dataset.html
          curl -L --fail --retry 3 \
            'https://universe.roboflow.com/ahmeds-workspace-fbvwb/handball-ball-player-detection/browse' \
            -o browse.html
          python - <<'PY'
          from pathlib import Path
          import re, json
          for name in ['dataset.html','browse.html']:
              text=Path(name).read_text(errors='replace')
              print(name, 'bytes', len(text))
              patterns=[
                  r'https?://[^"\'<> ]+',
                  r'[^"\']*(?:download|export|annotation|source\.roboflow|api\.roboflow)[^"\']*',
              ]
              hits=[]
              for p in patterns:
                  hits += re.findall(p,text,re.I)
              clean=[]
              for h in hits:
                  if any(k in h.lower() for k in ('roboflow','download','export','annotation')):
                      if h not in clean: clean.append(h)
              Path(name+'.hits.txt').write_text('\n'.join(clean[:1000]))
              print('hits',len(clean))
          PY
          grep -Eio 'https?://[^" ]+' dataset.html | grep -Ei 'roboflow|download|export' | head -100 || true
          grep -Eio 'https?://[^" ]+' browse.html | grep -Ei 'source\.roboflow|roboflow|download|export' | head -100 || true
      - name: Upload public metadata snapshot
        uses: actions/upload-artifact@v4
        with:
          name: roboflow-public-metadata
          path: |
            dataset.html
            browse.html
            dataset.html.hits.txt
            browse.html.hits.txt
          retention-days: 1
