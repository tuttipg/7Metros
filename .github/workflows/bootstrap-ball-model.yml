name: Bootstrap sports-ball model

on:
  push:
    branches:
      - tmp/ball-model-bootstrap-20261002

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact stock YOLO11n control
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt' \
            -o yolo11n.pt
          echo '0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1  yolo11n.pt' > expected.sha256
          sha256sum -c expected.sha256
          sha256sum yolo11n.pt > sha256.txt
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-yolo11n-control
          path: |
            yolo11n.pt
            sha256.txt
          retention-days: 1
