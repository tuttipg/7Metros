name: Bootstrap sports-ball model

on:
  push:
    branches:
      - tmp/ball-model-bootstrap-20261002

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download football-ball YOLO11n model and runtime wheel
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 \
            'https://huggingface.co/martinjolif/yolo-football-ball-detection/resolve/main/yolo-football-ball-detection.pt?download=true' \
            -o yolo-football-ball-detection.pt
          echo 'fb37942448e7de08745e8aab148d0794f680a738ddd55e5f17abe9ab2d6313fb  yolo-football-ball-detection.pt' > expected.sha256
          sha256sum -c expected.sha256
          python -m pip download --no-deps 'ultralytics==8.4.163' -d wheelhouse
          sha256sum yolo-football-ball-detection.pt wheelhouse/* > sha256.txt
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: football-ball-yolo11n
          path: |
            yolo-football-ball-detection.pt
            wheelhouse/
            sha256.txt
          retention-days: 1
