name: Bootstrap sports-ball model

on:
  push:
    branches:
      - tmp/ball-model-bootstrap-20261002

jobs:
  fetch-handball-data:
    runs-on: ubuntu-latest
    steps:
      - name: Install public-dataset client
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'roboflow==1.1.48'
      - name: Download public handball dataset without private credentials
        run: |
          set -euxo pipefail
          python - <<'PY'
          import roboflow
          ds = roboflow.download_dataset(
              dataset_url='https://universe.roboflow.com/ahmeds-workspace-fbvwb/handball-ball-player-detection/dataset/2',
              model_format='yolov8',
              location='handball_dataset',
          )
          print(ds.location)
          PY
          find handball_dataset -maxdepth 3 -type f | sort | head -100
          find handball_dataset -type f | wc -l | tee file_count.txt
          sha256sum handball_dataset/data.yaml > dataset_yaml.sha256
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-handball-dataset-v2
          path: |
            handball_dataset/
            file_count.txt
            dataset_yaml.sha256
          retention-days: 1
