name: FEMEBAL roster diagnostic — full bidirectional closure

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-bidirectional-closure-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Validate every roster athlete in reverse index
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get_json(){
            local path="$1" out="$2" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            [[ "$code" == 200 ]] || { echo "HTTP ${code}: ${path}"; exit 1; }
            jq -e . "$out" >/dev/null
          }

          : > "$tmp/results.tsv"
          for spec in '1843:775:Ferro Mayores A LHC' '3291:775:Ballester Mayores A LHC'; do
            IFS=: read -r team tournament label <<<"$spec"
            roster="$tmp/roster-${team}-${tournament}.json"
            get_json "/athletes/athletesByTeam/${team}?tournamentId=${tournament}" "$roster"
            rows="$(jq 'length' "$roster")"
            unique="$(jq '[.[].id|tostring]|unique|length' "$roster")"
            [[ "$rows" == "$unique" ]] || { echo "duplicate athleteId in ${label}"; exit 1; }

            checked=0
            missing=0
            while IFS=$'\t' read -r id first last; do
              reverse="$tmp/reverse-${team}-${tournament}-${id}.json"
              get_json "/athletes/${id}/tournaments" "$reverse"
              if jq -e --arg team "$team" --arg tournament "$tournament" \
                'any(.[]; (.team.id|tostring)==$team and (.tournament.id|tostring)==$tournament)' "$reverse" >/dev/null; then
                checked=$((checked+1))
              else
                echo "MISSING reverse membership: ${id} ${first} ${last} -> ${team}/${tournament}"
                missing=$((missing+1))
              fi
            done < <(jq -r '.[] | [.id,.firstName,.lastName] | @tsv' "$roster")

            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$team" "$tournament" "$label" "$rows" "$checked" "$missing" >> "$tmp/results.tsv"
            [[ "$missing" == 0 ]] || exit 1
            [[ "$checked" == "$rows" ]] || exit 1
          done

          cat "$tmp/results.tsv"
          total_rows="$(awk -F '\t' '{s+=$4} END{print s}' "$tmp/results.tsv")"
          total_checked="$(awk -F '\t' '{s+=$5} END{print s}' "$tmp/results.tsv")"
          total_missing="$(awk -F '\t' '{s+=$6} END{print s}' "$tmp/results.tsv")"
          echo "full_forward_to_reverse_closure=${total_checked}/${total_rows} missing=${total_missing}"
          [[ "$total_checked" == "$total_rows" && "$total_missing" == 0 ]]
          echo 'Guest legítimo 1.1.3; sólo GET después de onboarding; sin Supabase ni producción.'
