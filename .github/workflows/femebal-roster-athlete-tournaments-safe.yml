name: FEMEBAL roster diagnostic — athlete tournaments reverse membership

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-athlete-tournaments-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Validate athlete -> team+tournament relations bidirectionally
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || { echo "init-onboarding HTTP $code"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || { echo 'guest accessToken missing'; exit 1; }
          echo "::add-mask::${access}"

          get_json(){
            local path="$1" out="$2" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            [[ "$code" == 200 ]] || { echo "GET ${path} -> HTTP ${code}"; exit 1; }
            jq -e . "$out" >/dev/null
          }

          total_pairs=0
          verified_pairs=0
          for id in 16284 10565 19480; do
            out="$tmp/${id}.json"
            get_json "/athletes/${id}/tournaments" "$out"
            rows="$(jq 'length' "$out")"
            unique_pairs="$(jq '[.[] | [(.team.id|tostring),(.tournament.id|tostring)]] | unique | length' "$out")"
            echo "=== athleteId ${id}: rows=${rows} unique_pairs=${unique_pairs} ==="
            [[ "$rows" == "$unique_pairs" ]] || { echo "ERROR: duplicate reverse membership pair for athlete ${id}"; exit 1; }
            jq -e 'all(.[]; (keys|sort)==["team","tournament"])' "$out" >/dev/null

            while IFS=$'\t' read -r team tournament teamName tournamentName season; do
              total_pairs=$((total_pairs+1))
              roster="$tmp/roster-${id}-${team}-${tournament}.json"
              get_json "/athletes/athletesByTeam/${team}?tournamentId=${tournament}" "$roster"
              if jq -e --arg id "$id" 'any(.[]; (.id|tostring)==$id)' "$roster" >/dev/null; then
                verified_pairs=$((verified_pairs+1))
                printf 'OK athlete=%s team=%s tournament=%s season=%s teamName=%s tournament=%s rosterCount=%s\n' \
                  "$id" "$team" "$tournament" "$season" "$teamName" "$tournamentName" "$(jq 'length' "$roster")"
              else
                echo "ERROR: reverse pair ${id} -> ${team}/${tournament} does not contain athlete in forward roster"
                exit 1
              fi
            done < <(jq -r '.[] | [(.team.id|tostring),(.tournament.id|tostring),.team.name,.tournament.name,.tournament.season.description] | @tsv' "$out")
          done

          echo "bidirectional_membership_pairs=${verified_pairs}/${total_pairs}"
          [[ "$verified_pairs" == "$total_pairs" ]] || exit 1
          echo 'All reverse athlete memberships were confirmed by the exact forward roster endpoint.'
          echo 'Guest legítimo 1.1.3; sólo GET después de onboarding; sin Supabase ni producción.'
