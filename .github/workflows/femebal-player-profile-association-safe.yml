name: FEMEBAL player diagnostic — profile associations

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-player-profile-association-safe.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate final player profile artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in data/femebal/discovery/rosters/*.json; do
            python -m json.tool "$f" >/dev/null
          done

          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path('data/femebal/discovery/rosters/player-profile-integration-contract-v1.json').read_text())
          coverage = json.loads(Path('data/femebal/discovery/rosters/player-profile-coverage-ferro-1843-775-2026-10-02.json').read_text())
          assoc = json.loads(Path('data/femebal/discovery/rosters/player-profile-associations-ferro-1843-775-2026-10-02.json').read_text())

          assert contract['identity']['athlete'] == ['athleteId']
          assert contract['sources']['formationBulkProfile']['runtimeControl']['mismatches'] == 0
          assert contract['sources']['defaultTeam']['control'] == {'http200':16,'matchesExactRosterTeam':13,'otherTeam':3}
          assert contract['sources']['associatedClub']['control'] == {'http200':16,'matchesRosterClub':16}
          fc = contract['sources']['federativeCard']['control']
          assert fc['http200'] == 16
          assert fc['clubNameMatchesRosterClub'] == 16
          assert fc['categoryStringNonNull'] == 16
          assert fc['categoryExactlyMatchesTeamAgeCategory'] == 0

          h = contract['normalization']['height']
          assert h['sourceJsonTypeObserved'] == 'string'
          assert h['nonNullControlRows'] == 10
          assert h['numericLikeControlRows'] == 10
          assert h['parsedRange1ToLessThan3'] == 10
          assert h['parsedRange100To250'] == 0
          assert h['recommendedNormalizedField'] == 'height_cm'

          assert assoc['defaultTeam']['matchesRosterTeamId'] == 13
          assert assoc['defaultTeam']['otherTeamId'] == 3
          assert assoc['associatedClubId']['matchesRosterClubId'] == 16
          assert assoc['federativeCard']['categoryExactlyMatchesTeamAgeCategory'] == 0
          assert assoc['profileTypes']['height']['jsonString'] == 10
          assert assoc['profileTypes']['height']['parsedInRange1ToLessThan3'] == 10
          assert assoc['profileTypes']['height']['parsedInRange100To250'] == 0
          assert assoc['profileTypes']['height']['observedScale'] == 'meter_scale'

          assert coverage['profileVsFormation']['positionMismatch'] == 0
          assert coverage['profileVsFormation']['shirtNumberMismatch'] == 0

          doc = Path('docs/femebal/rosters/player-profile-contract.md').read_text()
          for needle in ['defaultTeam == 1843       13/16', 'height_cm = h * 100', 'categoría federativa = `team.ageCategory`']:
              assert needle in doc, needle

          print('Final player profile artifact assertions passed.')
          PY

          echo 'Final player profile validation passed.'
