name: FEMEBAL player diagnostic — profile associations

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-player-profile-association-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
      TOURNAMENT_ID: '775'
      CLUB_ID: '335'
    steps:
      - name: Measure aggregate profile association and type semantics
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get(){
            local path="$1" out="$2"
            curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" --output "$out" --write-out '%{http_code}' "${API_BASE}${path}"
          }

          team="$tmp/team.json"
          [[ "$(get "/teams/${TEAM_ID}" "$team")" == 200 ]] || exit 1
          target_club_name="$(jq -r '.club.name // empty' "$team")"
          target_category_name="$(jq -r '.ageCategory.name // empty' "$team")"
          [[ -n "$target_club_name" && -n "$target_category_name" ]] || exit 1

          roster="$tmp/roster.json"
          [[ "$(get "/athletes/athletesByTeam/${TEAM_ID}?tournamentId=${TOURNAMENT_ID}" "$roster")" == 200 ]] || exit 1
          [[ "$(jq 'length' "$roster")" == 16 ]] || exit 1

          default_team_200=0; default_team_matches=0; default_team_other=0
          club_id_200=0; club_id_matches=0
          fed_200=0; fed_club_matches=0; fed_category_matches=0; fed_category_string_nonnull=0; fed_status_nonnull=0; fed_habilitation_nonnull=0
          profile_200=0; height_nonnull=0; height_number=0; height_string=0; height_string_numeric_like=0; position_string_nonnull=0; shirt_number_numeric_nonnull=0

          while read -r id; do
            d="$tmp/d-${id}.json"
            code="$(get "/athletes/${id}/default-team" "$d")"
            if [[ "$code" == 200 ]]; then
              default_team_200=$((default_team_200+1))
              did="$(jq -r '.id // .team.id // empty' "$d" 2>/dev/null || true)"
              [[ "$did" == "$TEAM_ID" ]] && default_team_matches=$((default_team_matches+1)) || default_team_other=$((default_team_other+1))
            fi

            c="$tmp/c-${id}.json"
            code="$(get "/athletes/${id}/club-id" "$c")"
            if [[ "$code" == 200 ]]; then
              club_id_200=$((club_id_200+1))
              cid="$(jq -r 'if type=="number" or type=="string" then tostring elif type=="object" then ((.clubId // .id // .club.id // empty)|tostring) else empty end' "$c" 2>/dev/null || true)"
              [[ "$cid" == "$CLUB_ID" ]] && club_id_matches=$((club_id_matches+1)) || true
            fi

            f="$tmp/f-${id}.json"
            code="$(get "/athletes/${id}/federative-card" "$f")"
            if [[ "$code" == 200 ]] && jq -e 'type=="object"' "$f" >/dev/null 2>&1; then
              fed_200=$((fed_200+1))
              jq -e --arg v "$target_club_name" '.clubName == $v' "$f" >/dev/null && fed_club_matches=$((fed_club_matches+1)) || true
              jq -e --arg v "$target_category_name" '.category == $v' "$f" >/dev/null && fed_category_matches=$((fed_category_matches+1)) || true
              jq -e '.category != null and (.category|type)=="string" and .category!=""' "$f" >/dev/null && fed_category_string_nonnull=$((fed_category_string_nonnull+1)) || true
              jq -e '.status != null and .status != ""' "$f" >/dev/null && fed_status_nonnull=$((fed_status_nonnull+1)) || true
              jq -e '.habilitationYear != null' "$f" >/dev/null && fed_habilitation_nonnull=$((fed_habilitation_nonnull+1)) || true
            fi

            p="$tmp/p-${id}.json"
            code="$(get "/users/athlete-profile/${id}" "$p")"
            if [[ "$code" == 200 ]] && jq -e 'type=="object"' "$p" >/dev/null 2>&1; then
              profile_200=$((profile_200+1))
              if jq -e '.height != null' "$p" >/dev/null; then
                height_nonnull=$((height_nonnull+1))
                jq -e '(.height|type)=="number"' "$p" >/dev/null && height_number=$((height_number+1)) || true
                jq -e '(.height|type)=="string"' "$p" >/dev/null && height_string=$((height_string+1)) || true
                jq -e '(.height|type)=="string" and (.height|test("^[[:space:]]*[0-9]+([.,][0-9]+)?[[:space:]]*$"))' "$p" >/dev/null && height_string_numeric_like=$((height_string_numeric_like+1)) || true
              fi
              jq -e '.position != null and (.position|type)=="string"' "$p" >/dev/null && position_string_nonnull=$((position_string_nonnull+1)) || true
              jq -e '.shirtNumber != null and (.shirtNumber|type)=="number"' "$p" >/dev/null && shirt_number_numeric_nonnull=$((shirt_number_numeric_nonnull+1)) || true
            fi
          done < <(jq -r '.[].id|tostring' "$roster")

          echo "roster=16"
          echo "default_team_http_200=${default_team_200}"
          echo "default_team_matches_roster_team=${default_team_matches}"
          echo "default_team_other=${default_team_other}"
          echo "club_id_http_200=${club_id_200}"
          echo "club_id_matches_target=${club_id_matches}"
          echo "federative_card_http_200=${fed_200}"
          echo "federative_club_matches_target=${fed_club_matches}"
          echo "federative_category_string_nonnull=${fed_category_string_nonnull}"
          echo "federative_category_exactly_matches_team_ageCategory=${fed_category_matches}"
          echo "federative_status_nonnull=${fed_status_nonnull}"
          echo "federative_habilitationYear_nonnull=${fed_habilitation_nonnull}"
          echo "user_profile_http_200=${profile_200}"
          echo "profile_height_nonnull=${height_nonnull}"
          echo "profile_height_json_number=${height_number}"
          echo "profile_height_json_string=${height_string}"
          echo "profile_height_string_numeric_like=${height_string_numeric_like}"
          echo "profile_position_string_nonnull=${position_string_nonnull}"
          echo "profile_shirtNumber_numeric_nonnull=${shirt_number_numeric_nonnull}"
          echo 'No athlete IDs, names, dates, club/category names, height values, positions, shirt numbers, or federative scalar values were logged.'
          echo 'Guest legítimo 1.1.3; GET-only; sin Supabase ni producción.'
