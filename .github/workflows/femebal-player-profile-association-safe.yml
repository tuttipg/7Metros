name: FEMEBAL player diagnostic — profile associations

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-player-profile-association-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
      TOURNAMENT_ID: '775'
    steps:
      - name: Infer profile height scale from aggregate ranges only
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get(){
            local path="$1" out="$2"
            curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" --output "$out" --write-out '%{http_code}' "${API_BASE}${path}"
          }

          roster="$tmp/roster.json"
          [[ "$(get "/athletes/athletesByTeam/${TEAM_ID}?tournamentId=${TOURNAMENT_ID}" "$roster")" == 200 ]] || exit 1
          [[ "$(jq 'length' "$roster")" == 16 ]] || exit 1

          files=()
          while read -r id; do
            p="$tmp/profile-${id}.json"
            [[ "$(get "/users/athlete-profile/${id}" "$p")" == 200 ]] || exit 1
            files+=("$p")
          done < <(jq -r '.[].id|tostring' "$roster")

          jq -s '.' "${files[@]}" > "$tmp/profiles.json"

          total="$(jq 'length' "$tmp/profiles.json")"
          nonnull="$(jq '[.[] | select(.height != null)] | length' "$tmp/profiles.json")"
          string_count="$(jq '[.[] | select(.height != null and (.height|type)=="string")] | length' "$tmp/profiles.json")"
          parseable="$(jq '[.[] | select(.height != null and (.height|type)=="string") | (.height|gsub(",";".")|tonumber?)] | map(select(. != null)) | length' "$tmp/profiles.json")"
          meters_range="$(jq '[.[] | select(.height != null and (.height|type)=="string") | (.height|gsub(",";".")|tonumber?) | select(. != null and . >= 1 and . < 3)] | length' "$tmp/profiles.json")"
          centimeters_range="$(jq '[.[] | select(.height != null and (.height|type)=="string") | (.height|gsub(",";".")|tonumber?) | select(. != null and . >= 100 and . <= 250)] | length' "$tmp/profiles.json")"
          other_range="$(jq '[.[] | select(.height != null and (.height|type)=="string") | (.height|gsub(",";".")|tonumber?) | select(. != null and ((. < 1) or (. >= 3 and . < 100) or (. > 250)))] | length' "$tmp/profiles.json")"

          echo "profiles=${total}"
          echo "height_nonnull=${nonnull}"
          echo "height_string=${string_count}"
          echo "height_parseable_numeric=${parseable}"
          echo "height_in_1_to_lt3_range=${meters_range}"
          echo "height_in_100_to_250_range=${centimeters_range}"
          echo "height_other_numeric_range=${other_range}"
          echo 'No athlete IDs, names, height values, or other profile scalar values were logged.'
          echo 'Guest legítimo 1.1.3; GET-only; sin Supabase ni producción.'
