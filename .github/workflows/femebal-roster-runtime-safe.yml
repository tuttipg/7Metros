name: FEMEBAL roster runtime SAFE

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scoped authenticated guest roster discovery
        shell: bash
        env:
          API_BASE: https://api.femebal.cam.larrysport.tecdata.net
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )

          onboarding="$(mktemp)"
          code="$(curl "${common[@]}" \
            --request POST \
            --header 'Content-Type: application/json' \
            --output "$onboarding" \
            --write-out '%{http_code}' \
            "${API_BASE}/init-onboarding")"
          printf 'init-onboarding HTTP %s\n' "$code"
          test "$code" = '200' || { cat "$onboarding"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          test -n "$access" || { echo 'accessToken missing'; exit 1; }
          echo 'guest accessToken received and kept ephemeral'

          teams_body="$(mktemp)"
          teams_code="$(curl "${common[@]}" \
            --request GET \
            --header "Authorization: Bearer ${access}" \
            --output "$teams_body" \
            --write-out '%{http_code}' \
            "${API_BASE}/teams?club=335&category=100&gender=M")"
          printf '\n=== Ferro clubId=335 / Mayores category=100 / gender=M ===\nHTTP %s\n' "$teams_code"
          test "$teams_code" = '200' || { cat "$teams_body"; exit 1; }
          jq . "$teams_body"

          rm -f "$onboarding" "$teams_body"
          unset access
          echo 'Token remained ephemeral; read-only team discovery; no IDs guessed.'
