name: FEMEBAL roster runtime SAFE

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scoped authenticated guest roster discovery
        shell: bash
        env:
          API_BASE: https://api.femebal.cam.larrysport.tecdata.net
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )

          onboarding="$(mktemp)"
          code="$(curl "${common[@]}" \
            --request POST \
            --header 'Content-Type: application/json' \
            --output "$onboarding" \
            --write-out '%{http_code}' \
            "${API_BASE}/init-onboarding")"
          printf 'init-onboarding HTTP %s\n' "$code"
          test "$code" = '200' || { cat "$onboarding"; exit 1; }

          # Never print or persist the bearer. Verify only that the field exists.
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          test -n "$access" || { echo 'accessToken missing'; jq -r 'keys[]' "$onboarding"; exit 1; }
          echo 'guest accessToken received and kept ephemeral'

          search_body="$(mktemp)"
          search_code="$(curl "${common[@]}" \
            --request GET \
            --header "Authorization: Bearer ${access}" \
            --output "$search_body" \
            --write-out '%{http_code}' \
            "${API_BASE}/search?q=Ferro&skip=0")"
          printf '\n=== authenticated search Ferro ===\nHTTP %s\n' "$search_code"
          test "$search_code" = '200' || { cat "$search_body"; exit 1; }
          jq . "$search_body"

          rm -f "$onboarding" "$search_body"
          unset access
          echo 'No tokens printed or persisted; no writes beyond the app legitimate guest onboarding; no IDs guessed.'
