name: FEMEBAL roster runtime SAFE

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Scoped authenticated guest roster discovery
        shell: bash
        env:
          API_BASE: https://api.femebal.cam.larrysport.tecdata.net
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )

          onboarding="$(mktemp)"
          code="$(curl "${common[@]}" --request POST \
            --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' \
            "${API_BASE}/init-onboarding")"
          test "$code" = '200' || { cat "$onboarding"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          test -n "$access" || { echo 'accessToken missing'; exit 1; }
          echo 'guest onboarding OK; token ephemeral'

          tournaments_body="$(mktemp)"
          tournaments_code="$(curl "${common[@]}" --request GET \
            --header "Authorization: Bearer ${access}" \
            --output "$tournaments_body" --write-out '%{http_code}' \
            "${API_BASE}/teams/1843/tournaments")"
          printf '\n=== teamId 1843 tournaments ===\nHTTP %s\n' "$tournaments_code"
          test "$tournaments_code" = '200' || { cat "$tournaments_body"; exit 1; }
          jq . "$tournaments_body"

          rm -f "$onboarding" "$tournaments_body"
          unset access
          echo 'Read-only; no token printed/persisted; teamId came from prior runtime response.'
