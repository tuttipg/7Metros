name: FEMEBAL roster boundary — team+tournament

on:
  workflow_dispatch:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-boundary-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Probe roster contract boundaries read-only
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || { echo "init-onboarding HTTP $code"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || { echo 'guest accessToken missing'; exit 1; }
          echo "::add-mask::${access}"

          probe(){
            local label="$1" path="$2" out="$tmp/${3}.json" code kind count
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            kind="$(jq -r 'type' "$out" 2>/dev/null || echo non-json)"
            if [[ "$kind" == array ]]; then
              count="$(jq 'length' "$out")"
            else
              count='n/a'
            fi
            printf '%s\t%s\t%s\t%s\n' "$label" "$code" "$kind" "$count" >> "$tmp/results.tsv"
            echo "${label}: HTTP=${code} type=${kind} count=${count}"
          }

          : > "$tmp/results.tsv"
          probe 'VALID Ferro Mayores A / Apertura' '/athletes/athletesByTeam/1843?tournamentId=775' valid-a
          probe 'MISSING tournamentId' '/athletes/athletesByTeam/1843' missing-tournament
          probe 'MISMATCH Mayores A + Junior Apertura' '/athletes/athletesByTeam/1843?tournamentId=790' mismatch-a
          probe 'MISMATCH Mayores B + LHC Apertura' '/athletes/athletesByTeam/3256?tournamentId=775' mismatch-b
          probe 'VALID Ferro Mayores B / Apertura Plata' '/athletes/athletesByTeam/3256?tournamentId=782' valid-b

          # Controls must remain valid and non-empty.
          valid_a_count="$(awk -F '\t' '$1=="VALID Ferro Mayores A / Apertura"{print $4}' "$tmp/results.tsv")"
          valid_b_count="$(awk -F '\t' '$1=="VALID Ferro Mayores B / Apertura Plata"{print $4}' "$tmp/results.tsv")"
          [[ "$valid_a_count" =~ ^[1-9][0-9]*$ ]] || { echo 'ERROR: known valid 1843/775 roster is not non-empty'; exit 1; }
          [[ "$valid_b_count" =~ ^[1-9][0-9]*$ ]] || { echo 'ERROR: known valid 3256/782 roster is not non-empty'; exit 1; }

          {
            echo '# FEMEBAL roster boundary — runtime'
            echo
            echo '| Caso | HTTP | JSON type | jugadores |'
            echo '|---|---:|---|---:|'
            while IFS=$'\t' read -r label status kind count; do
              echo "| ${label} | ${status} | ${kind} | ${count} |"
            done < "$tmp/results.tsv"
            echo
            echo '> Guest legítimo LarrySport 1.1.3. Sólo GET después de init-onboarding. Sin Supabase, sin producción y sin persistir Bearer.'
          } >> "$GITHUB_STEP_SUMMARY"
