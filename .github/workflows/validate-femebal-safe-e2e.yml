name: Validate FEMEBAL SAFE E2E

on:
  pull_request:
    paths:
      - 'n8n/**'
      - '.github/workflows/validate-femebal-safe-e2e.yml'

permissions:
  contents: read

jobs:
  safe-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check SAFE E2E syntax
        run: node --check n8n/femebal-safe-e2e-smoke.mjs

      - name: Run SAFE E2E regression
        run: node n8n/femebal-safe-e2e-smoke.mjs
