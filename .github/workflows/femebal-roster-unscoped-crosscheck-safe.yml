name: FEMEBAL roster boundary — unscoped cross-check

on:
  workflow_dispatch:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-unscoped-crosscheck-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Compare scoped vs unscoped on known teams
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          fetch_array(){
            local path="$1" out="$2" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            [[ "$code" == 200 ]] || { echo "HTTP $code: $path"; exit 1; }
            jq -e 'type=="array"' "$out" >/dev/null
          }

          # teamId:tournamentId:label — all previously runtime-validated pairs.
          specs=(
            '1843:775:Ferro Mayores A LHC'
            '3256:782:Ferro Mayores B Plata'
            '3291:775:Ballester Mayores A LHC'
          )

          : > "$tmp/results.tsv"
          for spec in "${specs[@]}"; do
            IFS=: read -r team tournament label <<<"$spec"
            scoped="$tmp/scoped-${team}.json"
            unscoped="$tmp/unscoped-${team}.json"
            fetch_array "/athletes/athletesByTeam/${team}?tournamentId=${tournament}" "$scoped"
            fetch_array "/athletes/athletesByTeam/${team}" "$unscoped"

            scoped_rows="$(jq 'length' "$scoped")"
            scoped_unique="$(jq '[.[].id|tostring]|unique|length' "$scoped")"
            unscoped_rows="$(jq 'length' "$unscoped")"
            unscoped_unique="$(jq '[.[].id|tostring]|unique|length' "$unscoped")"
            unscoped_unique_objects="$(jq 'unique|length' "$unscoped")"
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$team" "$tournament" "$label" "$scoped_rows" "$scoped_unique" "$unscoped_rows" "$unscoped_unique" "$unscoped_unique_objects" >> "$tmp/results.tsv"
          done

          cat "$tmp/results.tsv"
          {
            echo '# FEMEBAL — scoped vs unscoped roster cross-check'
            echo
            echo '| teamId | tournamentId control | Equipo | scoped filas/IDs | sin torneo filas/IDs | objetos únicos sin torneo |'
            echo '|---:|---:|---|---:|---:|---:|'
            while IFS=$'\t' read -r team tournament label sr su ur uu uo; do
              echo "| ${team} | ${tournament} | ${label} | ${sr}/${su} | ${ur}/${uu} | ${uo} |"
            done < "$tmp/results.tsv"
            echo
            echo '> Controles conocidos, guest legítimo 1.1.3, read-only.'
          } >> "$GITHUB_STEP_SUMMARY"
