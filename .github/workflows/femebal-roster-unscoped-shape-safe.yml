name: FEMEBAL roster boundary — unscoped shape

on:
  workflow_dispatch:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-unscoped-shape-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
    steps:
      - name: Inspect duplicate shape without new endpoints
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || { echo "init-onboarding HTTP $code"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || { echo 'guest accessToken missing'; exit 1; }
          echo "::add-mask::${access}"

          roster="$tmp/roster.json"
          code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
            --output "$roster" --write-out '%{http_code}' "${API_BASE}/athletes/athletesByTeam/${TEAM_ID}")"
          [[ "$code" == 200 ]] || { echo "unscoped roster HTTP $code"; exit 1; }
          jq -e 'type=="array" and length>0' "$roster" >/dev/null

          rows="$(jq 'length' "$roster")"
          unique_ids="$(jq '[.[].id|tostring] | unique | length' "$roster")"
          unique_objects="$(jq 'unique | length' "$roster")"
          key_shapes="$(jq '[.[]|keys|sort] | unique | length' "$roster")"
          echo "rows=${rows} unique_ids=${unique_ids} unique_objects=${unique_objects} key_shapes=${key_shapes}"
          echo '--- key shapes ---'
          jq '[.[]|keys|sort] | unique' "$roster"

          # Count occurrences per identity, while verifying duplicate rows for a given athlete are byte-for-byte JSON equivalent after canonical sorting.
          jq -r '.[] | [(.id|tostring), .firstName, .lastName] | @tsv' "$roster" \
            | sort -k1,1n > "$tmp/identity.tsv"
          cut -f1 "$tmp/identity.tsv" | uniq -c | sort -nr > "$tmp/frequency.txt"

          inconsistent=0
          jq -r '.[].id|tostring' "$roster" | sort -u | while read -r id; do
            variants="$(jq --arg id "$id" '[.[]|select((.id|tostring)==$id)] | unique | length' "$roster")"
            if [[ "$variants" != 1 ]]; then
              echo "INCONSISTENT id=${id} variants=${variants}"
              inconsistent=$((inconsistent+1))
            fi
          done

          echo '--- top occurrence frequencies ---'
          head -20 "$tmp/frequency.txt"
          echo '--- extra/unscoped-only athlete identities from prior set ---'
          for id in 16283 16311 16357 17060 19471 19478 28362 28378 28380 51006; do
            jq -r --arg id "$id" '[.[]|select((.id|tostring)==$id)][0] | if .==null then "MISSING\t'+"$id"+'" else [(.id|tostring), .firstName, .lastName] | @tsv end' "$roster"
          done

          {
            echo '# FEMEBAL — unscoped roster shape'
            echo
            echo "- filas: **${rows}**"
            echo "- athleteId únicos: **${unique_ids}**"
            echo "- objetos JSON únicos: **${unique_objects}**"
            echo "- formas de claves observadas: **${key_shapes}**"
            echo
            echo '## Frecuencias más altas por athleteId'
            echo
            echo '| repeticiones | athleteId |'
            echo '|---:|---:|'
            head -20 "$tmp/frequency.txt" | awk '{print "| "$1" | "$2" |"}'
            echo
            echo '> Sólo se inspeccionó la respuesta conocida /athletes/athletesByTeam/1843 sin tournamentId. Guest legítimo 1.1.3, read-only.'
          } >> "$GITHUB_STEP_SUMMARY"
