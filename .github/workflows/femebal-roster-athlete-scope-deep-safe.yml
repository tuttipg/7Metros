name: FEMEBAL roster diagnostic — athlete scoped surfaces

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-athlete-scope-deep-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Inspect athlete tournament-scoped surfaces safely
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || { echo "init-onboarding HTTP $code"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || { echo 'guest accessToken missing'; exit 1; }
          echo "::add-mask::${access}"

          get_json(){
            local label="$1" path="$2" out="$3" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            echo "=== ${label} HTTP ${code} ==="
            if [[ "$code" != 200 ]]; then
              head -c 300 "$out" | tr '\n' ' '; echo
              return 0
            fi
            jq -e . "$out" >/dev/null
            echo "type=$(jq -r 'type' "$out")"
            echo 'top-level:'
            jq -c 'if type=="object" then keys elif type=="array" then {length:length,firstType:(if length>0 then .[0]|type else null end),firstKeys:(if length>0 and (.[0]|type)=="object" then .[0]|keys else [] end)} else . end' "$out"
            echo 'field paths:'
            jq -r '[paths] | map(map(tostring)|join(".")) | unique[]' "$out" | head -200
            echo 'sports-relevant scalar fields:'
            jq -c 'paths(scalars) as $p | ($p|map(tostring)|join(".")) as $k | select($k|test("goal|match|played|card|susp|exclusion|position|shirt|number|role|active|status|team|tournament";"i")) | {path:$k,value:getpath($p)}' "$out" | head -120
          }

          get_json 'athlete 16284 tournament 775 stats' '/athletes/16284/tournaments/775/stats' "$tmp/stats-775.json"
          get_json 'athlete 16284 tournament 790 stats' '/athletes/16284/tournaments/790/stats' "$tmp/stats-790.json"
          get_json 'athlete 16284 tournament 1204 stats' '/athletes/16284/tournaments/1204/stats' "$tmp/stats-1204.json"
          get_json 'athlete 19480 tournament 776 stats' '/athletes/19480/tournaments/776/stats' "$tmp/stats-776.json"
          get_json 'athlete 16284 identity' '/athletes/16284' "$tmp/athlete.json"
          get_json 'athlete 16284 formation enrichment' '/athletes/formation/positionAndNumber?athleteIds=16284' "$tmp/formation.json"
          get_json 'athlete 16284 user profile' '/users/athlete-profile/16284' "$tmp/profile.json"
          get_json 'team 1843 identity' '/teams/1843' "$tmp/team.json"

          echo 'Guest legítimo 1.1.3; GET-only después de onboarding; no Supabase ni producción.'
