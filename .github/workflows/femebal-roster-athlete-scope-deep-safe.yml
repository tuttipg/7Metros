name: FEMEBAL roster diagnostic — athlete scoped surfaces

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-athlete-scope-deep-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
    steps:
      - name: Bound remaining athlete surfaces without logging personal values
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || { echo "init-onboarding HTTP $code"; exit 1; }
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || { echo 'guest accessToken missing'; exit 1; }
          echo "::add-mask::${access}"

          inspect_shape(){
            local label="$1" path="$2" out="$3" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            echo "=== ${label} HTTP ${code} ==="
            if [[ "$code" != 200 ]]; then
              echo 'non-200 (body intentionally not logged)'
              return 0
            fi
            jq -e . "$out" >/dev/null
            echo "type=$(jq -r 'type' "$out")"
            jq -c 'if type=="object" then {keys:(keys|sort)} elif type=="array" then {length:length,firstType:(if length>0 then .[0]|type else null end),firstKeys:(if length>0 and (.[0]|type)=="object" then (.[0]|keys|sort) else [] end)} else {type:type} end' "$out"
            echo 'nested key paths matching possible membership metadata:'
            jq -r '[paths | map(tostring)|join(".")] | unique[] | select(test("team|tournament|role|position|shirt|number|active|status|start|end|date|membership|assignment|roster|club";"i"))' "$out" | head -120 || true
          }

          inspect_shape 'athlete 16284 federative card' '/athletes/16284/federative-card' "$tmp/fed-card.json"
          inspect_shape 'athlete 16284 socials' '/athletes/16284/socials' "$tmp/socials.json"
          inspect_shape 'athlete 16284 mvp awards' '/athletes/16284/mvp-awards' "$tmp/mvp.json"
          inspect_shape 'athlete 19480 federative card' '/athletes/19480/federative-card' "$tmp/fed-card-19480.json"

          echo 'No response scalar values were logged by this diagnostic.'
          echo 'Guest legítimo 1.1.3; GET-only después de onboarding; no Supabase ni producción.'
