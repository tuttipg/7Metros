name: Validate 7Metros

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check api.js
          node --check store.js
          node --check ui.js
          node --check pages.js
          node --check features.js
          node --check script.js
          node --check utils.js
          node --check config.js
          node --check store-smoke.mjs
          node --check navigation-smoke.mjs
          node --check category-order-smoke.mjs
          node --check dashboard-scope-smoke.mjs
          node --check csv-safety-smoke.mjs
          node --check date-utils-smoke.mjs
          node --check url-safety-smoke.mjs
          node --check standings-points-smoke.mjs
          node --check n8n/importer-core.mjs
          node --check n8n/importer-core-smoke.mjs
          node --check n8n/planilla-core.mjs
          node --check n8n/planilla-core-smoke.mjs
          node --check n8n/community-api-core.mjs
          node --check n8n/community-api-core-smoke.mjs

      - name: Check Python syntax
        run: python -m py_compile validate_site.py validate_backend_contract.py

      - name: Store smoke test
        run: node store-smoke.mjs

      - name: Navigation smoke test
        run: node navigation-smoke.mjs

      - name: Category order smoke test
        run: node category-order-smoke.mjs

      - name: Dashboard scope smoke test
        run: node dashboard-scope-smoke.mjs

      - name: CSV safety smoke test
        run: node csv-safety-smoke.mjs

      - name: Date utilities smoke test
        run: node date-utils-smoke.mjs

      - name: URL safety smoke test
        run: node url-safety-smoke.mjs

      - name: FEMEBAL standings points smoke test
        run: node standings-points-smoke.mjs

      - name: FEMEBAL importer core smoke test
        run: node n8n/importer-core-smoke.mjs

      - name: FEMEBAL planilla parser smoke test
        run: node n8n/planilla-core-smoke.mjs

      - name: FEMEBAL Community discovery smoke test
        run: node n8n/community-api-core-smoke.mjs

      - name: Validate static site
        run: python validate_site.py

      - name: Validate backend/importer contract
        run: python validate_backend_contract.py
