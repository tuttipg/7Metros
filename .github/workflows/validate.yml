name: Validate 7Metros

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          for f in api.js store.js ui.js pages.js features.js script.js utils.js config.js config-season-smoke.mjs api-loading-smoke.mjs store-smoke.mjs store-integrity-smoke.mjs team-integrity-smoke.mjs match-scope-smoke.mjs navigation-smoke.mjs category-order-smoke.mjs dashboard-scope-smoke.mjs csv-safety-smoke.mjs date-utils-smoke.mjs url-safety-smoke.mjs standings-points-smoke.mjs standings-copy-smoke.mjs standings-core.mjs standings-core-smoke.mjs standings-adjustments.mjs standings-adjustments-smoke.mjs player-route-core.mjs player-route-fix.js player-route-smoke.mjs scoped-route-core.mjs scoped-route-fix.js scoped-route-smoke.mjs match-freshness-core.mjs match-freshness.js match-freshness-smoke.mjs responsive-table-smoke.mjs mobile-menu-a11y-smoke.mjs; do node --check "$f"; done
          for f in n8n/importer-core.mjs n8n/importer-core-smoke.mjs n8n/official-url-policy.mjs n8n/discovery-manifest-bridge.mjs n8n/discovery-manifest-bridge-smoke.mjs n8n/planilla-core.mjs n8n/planilla-core-smoke.mjs n8n/planilla-dry-run-core.mjs n8n/planilla-dry-run-core-smoke.mjs n8n/pre-supabase-gate-core.mjs n8n/pre-supabase-gate-core-smoke.mjs n8n/preproduction-payload-core.mjs n8n/preproduction-payload-core-smoke.mjs n8n/preproduction-pipeline-core.mjs n8n/preproduction-pipeline-core-smoke.mjs n8n/official-pdf-fetch-core.mjs n8n/official-pdf-fetch-core-smoke.mjs n8n/pdf-extract-contract.mjs n8n/pdf-extract-contract-smoke.mjs n8n/pdf-extraction-wiring.mjs n8n/pdf-extraction-wiring-smoke.mjs n8n/femebal-safe-workflow-smoke.mjs n8n/community-api-core.mjs n8n/community-api-core-smoke.mjs n8n/programming-candidate-core.mjs n8n/programming-candidate-core-smoke.mjs n8n/tournamenttracker-public-core.mjs n8n/tournamenttracker-public-core-smoke.mjs n8n/tournamenttracker-static-endpoint-core.mjs n8n/tournamenttracker-static-endpoint-core-smoke.mjs n8n/tournamenttracker-query-policy-smoke.mjs n8n/tournamenttracker-indexed-route-core.mjs n8n/tournamenttracker-indexed-route-core-smoke.mjs; do node --check "$f"; done
      - name: Check Python syntax
        run: python -m py_compile validate_site.py validate_backend_contract.py tools/femebal_public_discovery.py tests/test_femebal_document_types.py tests/test_femebal_public_discovery.py tests/test_femebal_public_discovery_http.py tests/test_femebal_grouped_schedule_page.py tests/test_femebal_sensitive_query.py
      - name: Application smoke tests
        run: |
          for f in config-season-smoke.mjs api-loading-smoke.mjs store-smoke.mjs store-integrity-smoke.mjs team-integrity-smoke.mjs match-scope-smoke.mjs navigation-smoke.mjs category-order-smoke.mjs dashboard-scope-smoke.mjs csv-safety-smoke.mjs date-utils-smoke.mjs url-safety-smoke.mjs standings-points-smoke.mjs standings-copy-smoke.mjs standings-core-smoke.mjs standings-adjustments-smoke.mjs player-route-smoke.mjs scoped-route-smoke.mjs match-freshness-smoke.mjs responsive-table-smoke.mjs mobile-menu-a11y-smoke.mjs; do node "$f"; done
      - name: FEMEBAL SAFE pipeline smoke tests
        run: |
          for f in n8n/importer-core-smoke.mjs n8n/discovery-manifest-bridge-smoke.mjs n8n/planilla-core-smoke.mjs n8n/planilla-dry-run-core-smoke.mjs n8n/official-pdf-fetch-core-smoke.mjs n8n/pdf-extract-contract-smoke.mjs n8n/pdf-extraction-wiring-smoke.mjs n8n/femebal-safe-workflow-smoke.mjs n8n/community-api-core-smoke.mjs n8n/programming-candidate-core-smoke.mjs n8n/tournamenttracker-public-core-smoke.mjs n8n/tournamenttracker-static-endpoint-core-smoke.mjs n8n/tournamenttracker-query-policy-smoke.mjs n8n/tournamenttracker-indexed-route-core-smoke.mjs; do
            echo "::group::FEMEBAL SAFE smoke: $f"
            if ! node "$f"; then
              echo "::error title=FEMEBAL SAFE smoke failed::$f"
              echo "::endgroup::"
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: FEMEBAL pre-Supabase gate smoke test
        run: node n8n/pre-supabase-gate-core-smoke.mjs
      - name: FEMEBAL preproduction payload smoke test
        run: node n8n/preproduction-payload-core-smoke.mjs
      - name: FEMEBAL end-to-end preproduction preview smoke test
        run: node n8n/preproduction-pipeline-core-smoke.mjs
      - name: FEMEBAL public discovery unit tests
        run: python -m unittest -v tests.test_femebal_document_types tests.test_femebal_public_discovery tests.test_femebal_public_discovery_http tests.test_femebal_grouped_schedule_page tests.test_femebal_sensitive_query
      - name: Validate static site
        run: python validate_site.py
      - name: Validate backend/importer contract
        run: python validate_backend_contract.py
