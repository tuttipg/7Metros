name: Validate 7Metros

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check api.js
          node --check store.js
          node --check ui.js
          node --check pages.js
          node --check script.js
          node --check utils.js
          node --check config.js

      - name: Store smoke test
        run: node store-smoke.mjs

      - name: Validate static site
        run: python validate_site.py
