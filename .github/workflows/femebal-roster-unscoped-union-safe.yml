name: FEMEBAL roster diagnostic — unscoped union semantics

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-unscoped-union-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
    steps:
      - name: Resolve unscoped-only athletes through reverse memberships
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get_array(){
            local path="$1" out="$2" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            [[ "$code" == 200 ]] || { echo "HTTP ${code}: ${path}"; exit 1; }
            jq -e 'type=="array"' "$out" >/dev/null
          }

          unscoped="$tmp/unscoped.json"
          get_array "/athletes/athletesByTeam/${TEAM_ID}" "$unscoped"
          jq -r '.[].id|tostring' "$unscoped" | sort -u > "$tmp/unscoped.ids"

          : > "$tmp/known.raw"
          for tid in 775 1204 776; do
            r="$tmp/${tid}.json"
            get_array "/athletes/athletesByTeam/${TEAM_ID}?tournamentId=${tid}" "$r"
            jq -r '.[].id|tostring' "$r" >> "$tmp/known.raw"
            echo "known tournament=${tid} roster=$(jq 'length' "$r")"
          done
          sort -u "$tmp/known.raw" > "$tmp/known.ids"
          comm -23 "$tmp/unscoped.ids" "$tmp/known.ids" > "$tmp/remaining.ids"

          echo "unscoped_rows=$(jq 'length' "$unscoped") unique=$(wc -l < "$tmp/unscoped.ids" | xargs)"
          echo "known_775_1204_776_union=$(wc -l < "$tmp/known.ids" | xargs)"
          echo "remaining=$(wc -l < "$tmp/remaining.ids" | xargs)"
          echo '--- remaining athleteIds ---'
          cat "$tmp/remaining.ids"

          : > "$tmp/discovered-tournaments.raw"
          echo '--- reverse memberships on team 1843 for remaining athletes ---'
          while read -r id; do
            [[ -n "$id" ]] || continue
            reverse="$tmp/reverse-${id}.json"
            get_array "/athletes/${id}/tournaments" "$reverse"
            name="$(jq -r --arg id "$id" '[.[]|select(.team.id!=null)][0].team.club.name // ""' "$reverse")"
            echo "athleteId=${id}"
            jq -r --arg team "$TEAM_ID" '.[] | select((.team.id|tostring)==$team) | [(.tournament.id|tostring),.tournament.name,.tournament.season.description,.tournament.status] | @tsv' "$reverse" | tee "$tmp/pairs-${id}.tsv"
            cut -f1 "$tmp/pairs-${id}.tsv" >> "$tmp/discovered-tournaments.raw" || true
          done < "$tmp/remaining.ids"

          sort -u "$tmp/discovered-tournaments.raw" | sed '/^$/d' > "$tmp/discovered-tournaments.ids"
          echo '--- additional tournamentIds discovered ---'
          cat "$tmp/discovered-tournaments.ids"

          echo 'Guest legítimo 1.1.3; read-only; sin Supabase ni producción.'
