name: FEMEBAL roster diagnostic — unscoped union semantics

on:
  push:
    branches:
      - research/femebal-rosters-1.1.3
    paths:
      - .github/workflows/femebal-roster-unscoped-union-safe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      API_BASE: https://api.femebal.cam.larrysport.tecdata.net
      TEAM_ID: '1843'
    steps:
      - name: Prove unscoped response is exact roster multiset without tournament context
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --silent --show-error --location --max-time 15
            --header 'Accept: application/json'
            --header 'X-App-Variant: cah'
            --header 'X-App-Version: 1.1.3'
          )
          tmp="$(mktemp -d)"
          cleanup(){ rm -rf "$tmp"; unset access || true; }
          trap cleanup EXIT

          onboarding="$tmp/onboarding.json"
          code="$(curl "${common[@]}" --request POST --header 'Content-Type: application/json' \
            --output "$onboarding" --write-out '%{http_code}' "${API_BASE}/init-onboarding")"
          [[ "$code" == 200 ]] || exit 1
          access="$(jq -r '.accessToken // empty' "$onboarding")"
          [[ -n "$access" ]] || exit 1
          echo "::add-mask::${access}"

          get_array(){
            local path="$1" out="$2" code
            code="$(curl "${common[@]}" --request GET --header "Authorization: Bearer ${access}" \
              --output "$out" --write-out '%{http_code}' "${API_BASE}${path}")"
            [[ "$code" == 200 ]] || { echo "HTTP ${code}: ${path}"; exit 1; }
            jq -e 'type=="array"' "$out" >/dev/null
          }

          unscoped="$tmp/unscoped.json"
          get_array "/athletes/athletesByTeam/${TEAM_ID}" "$unscoped"
          jq -r '.[].id|tostring' "$unscoped" | sort > "$tmp/unscoped.raw"
          sort -u "$tmp/unscoped.raw" > "$tmp/unscoped.ids"
          uniq -c "$tmp/unscoped.raw" | awk '{print $2"\t"$1}' > "$tmp/unscoped.freq"

          : > "$tmp/union.raw"
          sum_rows=0
          for tid in 218 219 526 775 776 1204; do
            r="$tmp/${tid}.json"
            get_array "/athletes/athletesByTeam/${TEAM_ID}?tournamentId=${tid}" "$r"
            rows="$(jq 'length' "$r")"
            sum_rows=$((sum_rows + rows))
            jq -r '.[].id|tostring' "$r" >> "$tmp/union.raw"
            echo "tournament=${tid} rows=${rows} unique=$(jq '[.[].id|tostring]|unique|length' "$r")"
          done
          sort "$tmp/union.raw" -o "$tmp/union.raw"
          sort -u "$tmp/union.raw" > "$tmp/union.ids"
          uniq -c "$tmp/union.raw" | awk '{print $2"\t"$1}' > "$tmp/union.freq"

          unscoped_rows="$(jq 'length' "$unscoped")"
          unscoped_unique="$(wc -l < "$tmp/unscoped.ids" | xargs)"
          union_unique="$(wc -l < "$tmp/union.ids" | xargs)"

          echo "unscoped_rows=${unscoped_rows}"
          echo "sum_exact_roster_rows=${sum_rows}"
          echo "unscoped_unique=${unscoped_unique}"
          echo "six_tournament_union_unique=${union_unique}"

          diff -u "$tmp/unscoped.ids" "$tmp/union.ids"
          echo 'SET_EQUALITY=true'
          diff -u "$tmp/unscoped.freq" "$tmp/union.freq"
          echo 'MULTISET_FREQUENCY_EQUALITY=true'

          [[ "$unscoped_rows" == "$sum_rows" ]]
          [[ "$unscoped_unique" == "$union_unique" ]]

          echo '--- per-athlete multiplicities ---'
          cat "$tmp/unscoped.freq"
          echo 'CONFIRMED: for teamId 1843, the unscoped response is exactly the multiset concatenation of rosters 218,219,526,775,776,1204 after tournament context is erased.'
          echo 'Guest legítimo 1.1.3; read-only; sin Supabase ni producción.'
