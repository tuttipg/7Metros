<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#06192d">
  <meta name="description" content="7Metros: estadísticas, resultados, planteles y análisis del handball argentino.">
  <meta name="color-scheme" content="light">
  <title>Clubes — 7Metros</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script type="module" src="script.js"></script>
</head>
<body data-page="clubes" class="">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div id="mobile-bar" class="mobile-bar"></div>
  <div id="overlay" class="overlay"></div>
  <aside id="sidebar" class="sidebar" aria-label="Navegación principal"></aside>
  <main id="main-content" class="app-main">
    <div class="content-wrap">
      <header class="page-header">
        <div class="page-title-wrap">
          <span class="eyebrow" data-competition-label>7METROS</span>
          <h1>Clubes</h1>
          <p>Instituciones, rendimiento y acceso a sus planteles.</p>
        </div>
        <div class="header-tools">
          <span class="date-chip"><span data-icon="calendar"></span><span data-current-date></span></span>
          <span class="season-chip" data-season-label>CLAUSURA 2026</span>
        </div>
      </header>
      <div id="competition-bar" class="competition-bar" aria-label="Filtros de competición"></div>
      <div id="data-status" class="data-status" aria-live="polite"></div>
      
<div class="toolbar sticky-toolbar">
  <label class="search-box"><span class="search-icon" data-icon="search"></span><input id="club-search" type="search" placeholder="Buscar club…" autocomplete="off"></label>
  <select id="club-sort" class="filter-select" aria-label="Ordenar clubes"><option value="points">Ordenar: puntos</option><option value="name">Ordenar: nombre</option><option value="goals">Ordenar: goles a favor</option></select>
  <span class="result-count" id="club-count">—</span>
</div>
<section id="club-grid" class="page-grid loading-block"></section>

      <footer class="footer">
        <div class="footer-brand"><strong>7<b>METROS</b></strong><span>ESTADÍSTICAS · ANÁLISIS · RENDIMIENTO</span></div>
        <div class="footer-meta"><span>Proyecto independiente de análisis de handball argentino.</span><a data-femebal-link target="_blank" rel="noopener noreferrer">Fuente institucional: Fe.Me.Bal.</a></div>
      </footer>
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="global-search-root"></div>
</body>
</html>
