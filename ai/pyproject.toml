[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevenmetros-ai"
version = "0.1.0"
description = "Offline computer-vision baseline and integration contract for 7Metros"
requires-python = ">=3.10"

[project.optional-dependencies]
tracking = ["scipy>=1.10"]
vision = [
  "opencv-python>=4.8",
  "ultralytics>=8.3",
]
benchmark = [
  "opencv-python>=4.8",
  "ultralytics>=8.3",
  "lap>=0.5.12",
]
evaluation = ["trackeval==1.3.0"]

[project.scripts]
7metros-ai = "sevenmetros_ai.cli:main"

[tool.setuptools.packages.find]
include = ["sevenmetros_ai*"]
